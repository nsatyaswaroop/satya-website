<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Satya Nagisetti | Senior Data Engineer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf3e0; /* cream */
      color: #1a1a1a;
    }

    a { color: #0077aa; text-decoration: none; }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      z-index: 10;
    }

    header .logo {
      font-weight: 600;
      letter-spacing: 0.05em;
      font-size: 1.1rem;
    }

    nav a {
      margin-left: 1rem;
      font-size: 0.95rem;
      color: #333;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    section {
      margin-bottom: 3rem;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 2rem;
    }

    section:last-of-type {
      border-bottom: none;
    }

    h1, h2, h3 {
      margin-top: 0;
      color: #222;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 2rem;
    }

    .hero-photo {
      flex: 0 0 260px;
      height: 260px;
      background: #ffffff;
      border: 2px solid #0077aa;
      overflow: hidden;
      border-radius: 12px; /* square */
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-text {
      flex: 1 1 300px;
    }

    .tagline {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 0.75rem;
    }

    .buttons {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
